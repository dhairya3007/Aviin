<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviin</title>
<style>
  :root { --bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #ffffff; } }
  :root[data-theme="dark"] { --bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }

  #preloader {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: var(--bg); overflow: hidden;
    transition: opacity .7s ease, visibility .7s ease;
  }
  #preloader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }

  .stage { position: relative; width: min(80vw, 640px); aspect-ratio: 1000 / 467; }

  .logo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

  /* Text reveal runs on the logo WITHOUT the bird, left to right */
  #logoNoBird { clip-path: inset(0 100% 0 0); animation: write 1.9s cubic-bezier(.65,0,.35,1) .25s forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }

  /* Full logo (with its bird) stays hidden until the bird lands */
  #logoFull { opacity: 0; }

  /* The hummingbird, cut from the logo: a body layer and a wing layer */
  #bird {
    position: absolute; left: 0; top: 0;
    aspect-ratio: 387 / 321;
    opacity: 0; pointer-events: none;
    will-change: transform, opacity;
  }
  #bird img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #birdWing { transform-origin: 45.5% 43%; }   /* shoulder of the wing */

  @media (prefers-reduced-motion: reduce) {
    #logoNoBird { clip-path: none; animation: fade .6s ease .1s forwards; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    #bird { display: none; }
  }
</style>
</head>

<script>
(function () {
  var preloader = document.getElementById('preloader');
  var stage     = document.getElementById('stage');
  var logoFull  = document.getElementById('logoFull');
  var logoNo    = document.getElementById('logoNoBird');
  var bird      = document.getElementById('bird');
  var birdWing  = document.getElementById('birdWing');
  var birdBody  = document.getElementById('birdBody');

  // Where the hummingbird sits on the logo (fractions of the logo box), measured at build time
  var BOX = {"x": 0.7839321357285429, "y": 0.21367521367521367, "w": 0.19311377245508982, "h": 0.34294871794871795};

  var reduced   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAKEOFF   = 2250;   // ms after load: the logo reveal is done, the bird lifts off
  var FLIGHT    = 2600;   // ms in the air
  var MIN_SHOW  = reduced ? 900 : 5600;
  var MAX_SHOW  = 7500;   // hard fallback so the loader never hangs

  var t0 = performance.now();
  var pageLoaded = document.readyState === 'complete';
  var hidden = false;
  var rafId = null;
  var flightStart = 0;
  var tiltNow = 0;
  window.addEventListener('load', function () { pageLoaded = true; });

  function layout() {
    var W = stage.offsetWidth;
    bird.style.width = (BOX.w * W) + 'px';
  }
  layout();
  window.addEventListener('resize', function () { layout(); measure(); });

  // Smooth ease in and out: slow start, fast middle, slow landing
  function smooth(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }
  function cubic(t, a, b, c, d) { var u = 1 - t; return u*u*u*a + 3*u*u*t*b + 3*u*t*t*c + t*t*t*d; }
  function cubicD(t, a, b, c, d) { var u = 1 - t; return 3*u*u*(b-a) + 6*u*t*(c-b) + 3*t*t*(d-c); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function endFlight() {
    // The bird has landed exactly on its perch: swap to the full logo in one step
    bird.style.opacity = 0;
    logoNo.style.animation = 'none';
    logoNo.style.clipPath = 'none';
    logoNo.style.opacity = 0;
    logoFull.style.transition = 'none';
    logoFull.style.opacity = 1;
  }

  var lastNow = 0, Wc = 0, Hc = 0, BWc = 0, BHc = 0;
  function measure() {
    Wc = stage.offsetWidth; Hc = stage.offsetHeight;
    BWc = bird.offsetWidth; BHc = bird.offsetHeight;
  }

  // The bird enters from the top-right, always moving left, and lands on its perch.
  // Relative path from the perch (fractions of the stage): start far off the top-right.
  var P0 = [0.55, -0.75], P1 = [0.22, -0.38], P2 = [0.08, -0.08], P3 = [0, 0];

  function runBird(now) {
    var dt = lastNow ? Math.min((now - lastNow) / 1000, 0.05) : 0;
    lastNow = now;

    var raw = Math.min((now - flightStart) / FLIGHT, 1);
    var t = smooth(raw);
    var W = Wc, H = Hc;
    var px = (BOX.x + BOX.w / 2) * W, py = (BOX.y + BOX.h / 2) * H;

    var x = px + cubic(t, P0[0]*W, P1[0]*W, P2[0]*W, P3[0]*W);
    var y = py + cubic(t, P0[1]*H, P1[1]*H, P2[1]*H, P3[1]*H);
    var dx = cubicD(t, P0[0]*W, P1[0]*W, P2[0]*W, P3[0]*W);
    var dy = cubicD(t, P0[1]*H, P1[1]*H, P2[1]*H, P3[1]*H);

    // Wing and lean both ease to zero as the bird lands, so the landing pose matches the logo exactly
    var envIn  = smooth(Math.min(raw / 0.12, 1));
    var envOut = smooth(Math.min((1 - raw) / 0.25, 1));
    var env = envIn * envOut;

    var heading = Math.atan2(dy, dx) - Math.PI;
    if (heading > Math.PI) heading -= 2 * Math.PI;
    var tilt = clamp(heading * 180 / Math.PI, -18, 18) * env;

    var s = raw * FLIGHT / 1000;
    var beatHz = 11 - 4 * raw;
    var phase = s * Math.PI * 2 * beatHz;
    var wing = env * (3 + 13 * Math.sin(phase));
    var bob  = Math.sin(s * Math.PI * 2 * 1.2) * 1.5 * env;

    bird.style.transform =
      'translate(' + (x - BWc / 2).toFixed(2) + 'px,' + (y - BHc / 2 + bob).toFixed(2) + 'px) ' +
      'rotate(' + tilt.toFixed(2) + 'deg)';
    birdWing.style.transform = 'rotate(' + wing.toFixed(2) + 'deg)';
    bird.style.opacity = raw < 0.15 ? smooth(raw / 0.15).toFixed(3) : 1;

    if (raw < 1) rafId = requestAnimationFrame(runBird);
    else { rafId = null; endFlight(); }
  }

  function takeOff() {
    // The text has finished writing without the bird. Now the bird flies in from outside the frame.
    lastNow = 0;
    measure();
    bird.style.opacity = 0;
    flightStart = performance.now();
    rafId = requestAnimationFrame(runBird);
  }

  if (!reduced) setTimeout(takeOff, TAKEOFF);

  function hidePreloader() {
    if (hidden) return;
    hidden = true;
    if (rafId) cancelAnimationFrame(rafId);
    preloader.classList.add('is-done');
  }

  (function waitAndHide() {
    var elapsed = performance.now() - t0;
    if (elapsed >= MAX_SHOW || (pageLoaded && elapsed >= MIN_SHOW)) hidePreloader();
    else setTimeout(waitAndHide, 100);
  })();

  window.hidePreloader = hidePreloader;
