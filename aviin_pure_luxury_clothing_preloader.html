<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aviin — Pure Luxury Preloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       AVIIN EXACT LOGO PRELOADER — PURE CSS (#fcfbf9 LUXURY CANVAS)
       ========================================================================== */
    :root {
      --bg-canvas: #fcfbf9;
      --logo-ink: #141418; /* Exact deep luxury ink from 8.jpg / Aviin brand */
      --stage-width: clamp(280px, 62vmin, 580px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background-color: var(--bg-canvas);
      color: var(--logo-ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Fullscreen Perfectly Centered Preloader Stage */
    .aviin-preloader-scene {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-canvas);
      padding: 24px;
      overflow: hidden;
    }

    /* Ambient Subtle Iridescent Glow */
    .ambient-glow {
      position: absolute;
      width: min(600px, 90vw);
      height: min(600px, 90vw);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(0, 229, 255, 0.06) 0%,
        rgba(18, 199, 92, 0.05) 30%,
        rgba(255, 128, 0, 0.05) 55%,
        rgba(158, 0, 237, 0.04) 75%,
        transparent 90%
      );
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
    }

    /* Fluid Responsive 1000x560 Coordinate Stage Shell */
    .logo-stage-shell {
      position: relative;
      z-index: 10;
      width: var(--stage-width);
      aspect-ratio: 1000 / 560;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .aviin-exact-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* ==========================================================================
       LETTER-BY-LETTER BRUSH-SCRIPT "Aviin" REVEAL (Pure CSS)
       ========================================================================== */
    .logo-ink-path {
      fill: var(--logo-ink);
    }

    .letter-unit {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: left center;
      will-change: transform, opacity, filter;
      animation: exactLetterReveal 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .unit-a-stem { animation-delay: 0.12s; }
    .unit-a-bar  { animation-delay: 0.42s; }
    .unit-v      { animation-delay: 0.72s; }
    .unit-i1     { animation-delay: 0.98s; }
    .unit-i2     { animation-delay: 1.22s; }
    .unit-n      { animation-delay: 1.46s; }

    @keyframes exactLetterReveal {
      0% {
        opacity: 0;
        transform: translate3d(-14px, 18px, 0) scale(0.94);
        filter: blur(6px);
      }
      65% {
        opacity: 1;
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
        filter: blur(0px);
      }
    }

    /* Slanted Dots of the two 'i's */
    .unit-dot {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: exactDotPop 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .unit-dot-1 { animation-delay: 1.12s; }
    .unit-dot-2 { animation-delay: 1.36s; }

    @keyframes exactDotPop {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ==========================================================================
       SMOOTH REALISTIC HUMMINGBIRD FLIGHT (Pure CSS)
       ========================================================================== */
    .bird-flight-master {
      transform-origin: 845px 456px;
      will-change: transform, opacity, filter;
      animation:
        smoothBirdFlightIn 2.15s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both,
        gentleBirdHover 2.6s ease-in-out 2.37s infinite alternate;
    }

    .bird-wing-primary {
      transform-origin: 848px 447px;
      will-change: transform;
      animation:
        hummingbirdWingFlutter 0.068s ease-in-out 28 alternate,
        perchedWingBreathe 1.5s ease-in-out 2.2s infinite alternate;
    }

    .bird-wing-secondary {
      transform-origin: 848px 450px;
      will-change: transform;
      animation:
        hummingbirdUnderWingFlutter 0.068s ease-in-out 28 alternate-reverse,
        perchedWingBreathe 1.5s ease-in-out 2.28s infinite alternate;
    }

    .bird-tail-feathers {
      transform-origin: 866px 474px;
      animation: tailLandingBalance 2.15s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both;
    }

    @keyframes smoothBirdFlightIn {
      0% {
        opacity: 0;
        transform: translate3d(260px, -210px, 0) scale(0.38) rotate(-32deg);
        filter: blur(5px);
      }
      22% {
        opacity: 1;
        filter: blur(0px);
      }
      58% {
        transform: translate3d(-34px, -26px, 0) scale(1.07) rotate(8deg);
      }
      82% {
        transform: translate3d(7px, 4px, 0) scale(0.99) rotate(-3deg);
      }
      100% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0) scale(1) rotate(0deg);
        filter: blur(0px);
      }
    }

    @keyframes hummingbirdWingFlutter {
      0% {
        transform: rotate(0deg) scaleY(1) skewX(0deg);
      }
      100% {
        transform: rotate(-25deg) scaleY(0.70) skewX(-9deg);
      }
    }

    @keyframes hummingbirdUnderWingFlutter {
      0% {
        transform: rotate(4deg) scaleY(1.02);
      }
      100% {
        transform: rotate(-16deg) scaleY(0.76) skewX(-5deg);
      }
    }

    @keyframes perchedWingBreathe {
      0% {
        transform: rotate(0deg) scaleY(1);
      }
      100% {
        transform: rotate(-3.5deg) scaleY(0.95);
      }
    }

    @keyframes tailLandingBalance {
      0%   { transform: rotate(20deg) scaleX(0.86); }
      62%  { transform: rotate(-12deg) scaleX(1.07); }
      100% { transform: rotate(0deg) scaleX(1); }
    }

    @keyframes gentleBirdHover {
      0% {
        transform: translate3d(0px, 0px, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(0px, -5.5px, 0) rotate(1.4deg);
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Centered Pure Preloader -->
  <main class="aviin-preloader-scene" id="aviinPreloaderScene">
    <!-- Subtle Ambient Iridescent Glow -->
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Exact 1000x560 Coordinate Stage -->
    <div class="logo-stage-shell">
      <svg class="aviin-exact-svg" id="aviinExactSvg" viewBox="0 220 1000 560" xmlns="http://www.w3.org/2000/svg" aria-label="Aviin">
        <defs>
          <!-- Hummingbird Gradients Sampled Directly from logo_preserved.jpg -->
          <linearGradient id="birdBeakGrad" x1="772" y1="427" x2="816" y2="432" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3c0ca8" />
            <stop offset="55%" stop-color="#1d35d8" />
            <stop offset="100%" stop-color="#0066ff" />
          </linearGradient>

          <linearGradient id="birdCrownGrad" x1="806" y1="422" x2="854" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00f2ff" />
            <stop offset="48%" stop-color="#00e096" />
            <stop offset="100%" stop-color="#12ba5c" />
          </linearGradient>

          <linearGradient id="birdChestGrad" x1="810" y1="438" x2="878" y2="492" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0048ff" />
            <stop offset="38%" stop-color="#00aaff" />
            <stop offset="72%" stop-color="#00e1d9" />
            <stop offset="100%" stop-color="#242ef0" />
          </linearGradient>

          <linearGradient id="birdWingGrad" x1="848" y1="458" x2="939" y2="398" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0eb854" />
            <stop offset="20%" stop-color="#84e320" />
            <stop offset="42%" stop-color="#ffda00" />
            <stop offset="65%" stop-color="#ff7b00" />
            <stop offset="88%" stop-color="#ff2a00" />
            <stop offset="100%" stop-color="#dc1000" />
          </linearGradient>

          <linearGradient id="birdTailGrad" x1="864" y1="472" x2="899" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0055ff" />
            <stop offset="45%" stop-color="#6200ea" />
            <stop offset="85%" stop-color="#a900f5" />
            <stop offset="100%" stop-color="#480699" />
          </linearGradient>
        </defs>

        <!-- 1. EXACT BRUSH-SCRIPT "Aviin" (Letter-by-Letter CSS Reveal) -->
        <g id="exactAviinBrushWordmark">
          <!-- Letter 1A: Capital 'A' Diagonal Left Strut + Apex + Right Downstroke -->
          <g class="letter-unit unit-a-stem">
            <path class="logo-ink-path" d="
              M 476 327
              C 499 324, 515 335, 511 358
              C 502 406, 474 478, 444 556
              C 424 606, 405 648, 392 659
              C 380 668, 361 666, 357 651
              C 354 636, 363 606, 381 558
              C 408 486, 444 404, 468 351
              C 442 362, 396 398, 342 456
              C 272 530, 206 610, 174 644
              C 166 652, 157 648, 159 636
              C 162 618, 186 584, 236 528
              C 312 442, 402 362, 456 334
              C 464 330, 470 328, 476 327 Z" />
          </g>

          <!-- Letter 1B: Capital 'A' Sweeping Brush Crossbar -->
          <g class="letter-unit unit-a-bar">
            <path class="logo-ink-path" d="
              M 45 554
              C 41 564, 52 572, 68 566
              C 104 552, 166 520, 246 498
              C 338 473, 442 469, 532 478
              C 552 480, 565 483, 569 485
              C 572 486, 573 483, 568 480
              C 548 470, 488 462, 412 462
              C 312 462, 204 484, 112 522
              C 72 538, 49 546, 45 554 Z" />
          </g>

          <!-- Letter 2: Handwritten Brush 'v' -->
          <g class="letter-unit unit-v">
            <path class="logo-ink-path" d="
              M 476 504
              C 484 488, 514 489, 517 506
              C 519 520, 501 558, 494 584
              C 491 594, 496 596, 505 585
              C 528 560, 556 520, 574 494
              C 580 486, 589 488, 585 498
              C 566 534, 532 584, 498 610
              C 480 623, 454 619, 452 595
              C 450 568, 465 524, 476 504 Z" />
          </g>

          <!-- Letter 3: First 'i' Stem + Slanted Dot -->
          <g class="letter-unit unit-i1">
            <path class="logo-ink-path" d="
              M 598 500
              C 608 486, 636 488, 636 506
              C 636 522, 614 558, 610 578
              C 608 587, 614 589, 624 580
              C 642 566, 664 538, 678 514
              C 683 506, 690 510, 685 520
              C 668 552, 642 586, 616 600
              C 596 610, 574 601, 574 576
              C 574 550, 589 516, 598 500 Z" />
          </g>
          <ellipse class="logo-ink-path unit-dot unit-dot-1"
                   cx="645" cy="456" rx="21.5" ry="14.5"
                   transform="rotate(-34 645 456)" />

          <!-- Letter 4: Second 'i' Stem + Slanted Dot -->
          <g class="letter-unit unit-i2">
            <path class="logo-ink-path" d="
              M 678 498
              C 688 484, 715 486, 715 504
              C 715 520, 694 554, 690 574
              C 688 583, 694 585, 704 576
              C 722 562, 744 534, 758 510
              C 763 502, 770 506, 765 516
              C 748 548, 722 582, 696 596
              C 676 606, 654 597, 654 572
              C 654 546, 669 514, 678 498 Z" />
          </g>
          <ellipse class="logo-ink-path unit-dot unit-dot-2"
                   cx="724" cy="455" rx="21.5" ry="14.5"
                   transform="rotate(-34 724 455)" />

          <!-- Letter 5: Handwritten Brush 'n' -->
          <g class="letter-unit unit-n">
            <path class="logo-ink-path" d="
              M 754 490
              C 764 476, 792 478, 792 496
              C 792 512, 776 540, 770 554
              C 792 524, 818 494, 840 484
              C 858 476, 874 485, 871 508
              C 868 530, 856 556, 858 568
              C 860 577, 870 577, 884 568
              C 904 554, 928 530, 945 510
              C 950 504, 956 508, 951 517
              C 932 544, 904 574, 878 587
              C 852 599, 825 590, 825 564
              C 825 544, 837 518, 837 507
              C 837 500, 830 500, 818 511
              C 796 530, 772 562, 758 580
              C 746 595, 724 590, 726 568
              C 728 544, 744 508, 754 490 Z" />
          </g>
        </g>

        <!-- 2. EXACT RAINBOW HUMMINGBIRD FLIGHT & HOVER (Pure CSS) -->
        <g class="bird-flight-master" id="birdFlightMaster">
          <!-- Violet-Purple Tail Feathers -->
          <g class="bird-tail-feathers">
            <path d="M 866 462 C 878 472, 890 488, 898 510 C 888 500, 875 486, 864 472 Z" fill="#00b4d8" opacity="0.92" />
            <path d="M 856 470
                     C 868 482, 880 500, 889 514
                     L 886 506 L 894 515
                     L 891 505 L 899 514
                     C 890 494, 878 474, 864 464 Z"
                  fill="url(#birdTailGrad)" />
            <path d="M 866 472 C 876 485, 886 500, 894 512 C 884 498, 874 482, 866 472 Z" fill="#d426ff" opacity="0.82" />
          </g>

          <!-- Emerald Secondary Under-Wing -->
          <g class="bird-wing-secondary">
            <path d="M 846 446
                     C 862 430, 880 416, 900 406
                     L 890 420 L 905 415
                     L 890 430 L 907 428
                     L 888 442 L 904 442
                     C 882 450, 862 452, 846 446 Z"
                  fill="#12c75c" />
          </g>

          <!-- Primary Raised Rainbow Wing (Green -> Yellow -> Orange -> Red) -->
          <g class="bird-wing-primary">
            <path d="M 846 447
                     C 868 422, 902 400, 935 388
                     L 927 398 L 939 393
                     L 924 407 L 935 404
                     L 918 417 L 931 414
                     L 912 427 L 924 425
                     L 904 436 L 916 435
                     L 894 445 L 906 445
                     L 880 452 L 892 453
                     C 875 458, 856 456, 846 447 Z"
                  fill="url(#birdWingGrad)" />
            <path d="M 852 444 C 874 424, 904 404, 931 393 C 906 411, 880 430, 858 448 Z" fill="#ff9e00" opacity="0.74" />
            <path d="M 850 445 C 866 428, 888 412, 908 402 C 888 418, 870 434, 854 447 Z" fill="#a8eb12" opacity="0.62" />
          </g>

          <!-- Cobalt & Cyan-Turquoise Chest + Emerald Back -->
          <g class="bird-body-core">
            <path d="M 808 432
                     C 815 439, 818 452, 823 465
                     C 828 478, 840 485, 866 488
                     C 876 489, 884 487, 888 483
                     C 878 469, 864 454, 846 441
                     C 832 432, 819 430, 808 432 Z"
                  fill="url(#birdChestGrad)" />
            <path d="M 830 432
                     C 842 439, 855 450, 868 463
                     C 856 463, 842 452, 830 432 Z"
                  fill="#1fd660" opacity="0.9" />
          </g>

          <!-- Slender Indigo-Blue Beak + Cyan-Green Crown + Eye -->
          <g class="bird-head-core">
            <path d="M 770 423 Q 792 423 812 428 L 811 433 Q 792 427 770 423 Z" fill="url(#birdBeakGrad)" />
            <path d="M 807 431
                     C 814 422, 824 419, 835 422
                     C 844 425, 852 434, 856 445
                     C 842 447, 825 443, 807 431 Z"
                  fill="url(#birdCrownGrad)" />
            <ellipse cx="821" cy="431" rx="3.4" ry="2.8" transform="rotate(-6 821 431)" fill="#14226b" />
            <circle cx="820.2" cy="430.3" r="0.85" fill="#00f0ff" opacity="0.78" />
          </g>
        </g>
      </svg>
    </div>
  </main>

</body>
</html>
