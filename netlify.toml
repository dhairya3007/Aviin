[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/subscribe to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# React SPA client-side fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

