[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/**"]

# Route /api/subscribe to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# React SPA client-side fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
